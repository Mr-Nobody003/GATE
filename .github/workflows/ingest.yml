name: PDF Ingestion

on:
  schedule:
    # Run every 6 hours to stay within limits
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      volume:
        description: 'Volume to process (e.g. volume1, volume2)'
        required: true
        default: 'volume1'
      start_page:
        description: 'Start page index (leave empty to resume from state)'
        required: false
        default: ''
      end_page:
        description: 'End page index (leave empty to process 50 pages)'
        required: false
        default: ''

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libzbar0 libgl1

      - name: Install Python dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Run Ingestion Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: 1
        run: |
          VOLUME="${{ github.event.inputs.volume }}"
          START_PAGE="${{ github.event.inputs.start_page }}"
          END_PAGE="${{ github.event.inputs.end_page }}"
          
          if [ -z "$VOLUME" ]; then
            VOLUME="volume1"
          fi
          
          python scripts/ingest.py filter1_${VOLUME}.pdf "$START_PAGE" "$END_PAGE"

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ public/images/
          
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(data): Update extracted data for volume"
            git push
          fi

