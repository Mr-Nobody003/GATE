name: PDF Ingestion

on:
  workflow_dispatch:
    inputs:
      volume:
        description: 'Volume to process (e.g. volume1, volume2)'
        required: true
        default: 'volume1'
      max_pages:
        description: 'Maximum pages to process (leave empty for all)'
        required: false
        default: '10'

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libzbar0 libgl1

      - name: Install Python dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Run Ingestion Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/ingest.py filter1_${{ github.event.inputs.volume }}.pdf ${{ github.event.inputs.max_pages }}

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ public/images/
          
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(data): Update extracted data for ${{ github.event.inputs.volume }}"
            git push
          fi
